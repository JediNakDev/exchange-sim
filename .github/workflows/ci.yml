name: ci
on:
  push:
  pull_request:
jobs:
  test:
    name: unit and integration (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: make -j4 unit MODE=${{ matrix.mode }} EXTRA_CXXFLAGS=-Werror
      - name: API and exchange integration
        run: make -j4 integration MODE=${{ matrix.mode }} EXTRA_CXXFLAGS=-Werror
