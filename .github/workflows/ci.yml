name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.cxx }} ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++,     mode: release }
          - { os: ubuntu-24.04, cxx: g++,     mode: debug }
          - { os: ubuntu-24.04, cxx: clang++, mode: release }
          - { os: ubuntu-24.04, cxx: clang++, mode: debug }
          - { os: ubuntu-24.04, cxx: clang++, mode: tsan }
          - { os: macos-15,     cxx: clang++, mode: release }
          - { os: macos-15,     cxx: clang++, mode: debug }
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: make -j4 test MODE=${{ matrix.mode }} CXX=${{ matrix.cxx }} EXTRA_CXXFLAGS=-Werror
      - name: tools and examples
        if: matrix.mode == 'release'
        run: make -j4 tools examples MODE=release CXX=${{ matrix.cxx }} EXTRA_CXXFLAGS=-Werror

  perf-smoke:
    name: perf build + zero-allocation bench smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build optimised tools
        run: make -j4 tools MODE=perf CXX=clang++
      - name: engine benchmark (fails on any hot-path allocation)
        run: ./build/perf/exsim_bench --ops 200000

  research-determinism:
    # The research runner promises byte-identical artifacts for the same config
    # and seed. Each platform and compiler writes one digest per artifact, and
    # research-determinism-compare requires them all to be equal, across
    # x86_64 Linux (g++, clang++) and arm64 macOS (Apple clang).
    name: research determinism (${{ matrix.os }} ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++ }
          - { os: ubuntu-24.04, cxx: clang++ }
          - { os: macos-15,     cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: build research runner
        run: make -j4 tools MODE=release CXX=${{ matrix.cxx }} EXTRA_CXXFLAGS=-Werror
      - name: run every research config over fixed seeds
        run: sh .github/scripts/research_digests.sh build/release/exsim_research "research-digests-${{ matrix.os }}-${{ matrix.cxx }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: research-digests-${{ matrix.os }}-${{ matrix.cxx }}
          path: research-digests-*.txt

  research-determinism-compare:
    name: research artifacts identical across platforms
    needs: research-determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: research-digests-*
          merge-multiple: true
      - name: compare digests
        run: |
          set -e
          reference=$(ls research-digests-*.txt | head -n 1)
          for digests in research-digests-*.txt; do
            echo "$digests: $(wc -l < "$digests") artifacts"
            if ! cmp -s "$reference" "$digests"; then
              echo "research artifacts differ between $reference and $digests:"
              diff "$reference" "$digests" | head -n 40
              exit 1
            fi
          done

  differential-fuzz:
    # Random command streams through the production engine and the independent
    # oracle, compared event by event. Release covers volume; debug runs the
    # same streams under ASan and UBSan.
    name: differential fuzz vs oracle (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: release, seeds: 1000 }
          - { mode: debug,   seeds: 200 }
    steps:
      - uses: actions/checkout@v4
      - name: build fuzzer
        run: make -j4 tools MODE=${{ matrix.mode }} CXX=clang++ EXTRA_CXXFLAGS=-Werror
      - name: canary (an injected oracle bug must be caught)
        run: |
          if ./build/${{ matrix.mode }}/exsim_fuzz --inject --profile mixed --seeds 50 --steps 2000 \
               --artifact "$RUNNER_TEMP/canary" > /dev/null 2>&1; then
            echo "fuzzer missed the injected LIFO bug"; exit 1
          fi
      - name: fixed seeds
        run: |
          mkdir -p fuzz-reproducers
          for profile in mixed tiny; do
            ./build/${{ matrix.mode }}/exsim_fuzz --profile $profile --seed 1 --seeds ${{ matrix.seeds }} \
              --steps 2000 --artifact fuzz-reproducers/fixed-$profile
          done
      - name: rolling seeds (new range each run)
        run: |
          mkdir -p fuzz-reproducers
          first_seed=$(( ${{ github.run_number }} * 1000000 ))
          echo "first seed $first_seed; reproduce with --seed $first_seed --seeds ${{ matrix.seeds }} --steps 2000"
          for profile in mixed tiny; do
            ./build/${{ matrix.mode }}/exsim_fuzz --profile $profile --seed $first_seed --seeds ${{ matrix.seeds }} \
              --steps 2000 --artifact fuzz-reproducers/rolling-$profile
          done
      - name: keep shrunk reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-${{ matrix.mode }}
          path: fuzz-reproducers/
          if-no-files-found: ignore
