# Empty exchange. External clients provide every order.
[exchange]
name = EXSIM
bind_address = 127.0.0.1
ouch_port = 15000
max_connections = 16

[market_data]
address = 239.192.10.1
port = 16000
retransmit_port = 16001
session = EXSIM
retransmit_buffer = 4096

[engine]
max_instruments = 4
max_orders = 4096
max_tokens_per_session = 4096
store_messages_per_session = 8192
store_bytes_per_session = 1048576

[instrument AAPL]
tick_size = 0.01
lot_size = 1
min_price = 0.01
max_price = 1000.00
reference_price = 150.00
initial_phase = continuous

[user ALICE]
password = alice
protocol = ouch42
session_id = 1
owner = 1
cancel_on_disconnect = true

[user BOB]
password = bob
protocol = ouch42
session_id = 2
owner = 2
cancel_on_disconnect = true
