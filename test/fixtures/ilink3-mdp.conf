# Empty outright futures simulator, with FIX/OUCH order entry and CME MDP.
[exchange]
name = EXSIM
bind_address = 127.0.0.1
ouch_port = 0
fix_port = 0
max_connections = 4

[market_data]
protocol = mdp3
address = 127.0.0.1
port = 19001
backup_port = 19002
snapshot_port = 19003
instrument_port = 19004
retransmit_port = 0
channel_id = 310
market_segment_id = 1
book_depth = 10
max_payload = 1400
replay_buffer_packets = 4096
replay_username = CME
replay_password = exsim-replay
snapshot_interval_ms = 1000
instrument_interval_ms = 5000

[engine]
max_instruments = 4
max_orders = 256
max_tokens_per_session = 512
store_messages_per_session = 2048
store_bytes_per_session = 1048576

[instrument ES]
cme_security_id = 800001
cme_symbol = ES-SIMULATED-FUTURE
cme_maturity_date = 20991231
cme_contract_size = 50
tick_size = 0.25
lot_size = 1
max_order_qty = 1000
min_price = 1
max_price = 1000
reference_price = 150
initial_phase = continuous

[user ALICE]
password = alice
protocol = fix44
session_id = 1
owner = 1
cancel_on_disconnect = true

[user BOB]
password = bob
protocol = fix44
session_id = 2
owner = 2
cancel_on_disconnect = true

[user ILINK]
protocol = ilink3
session_id = 3
owner = 3
cancel_on_disconnect = true
ilink_access_key = ACCESS-1
ilink_secret_key = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
ilink_session = AAA
ilink_firm = EXSIM
ilink_party_id = 1001
ilink_account = SIM-ACCOUNT
