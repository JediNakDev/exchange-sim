# First vertical slice (product workflow): fixed-spread market maker quoting
# one tick either side of the strategy-visible mid, in a synthetic book with a
# seeded background market maker and noise taker. Pair with
# fixed_spread_wide.conf (same file except half_spread_ticks) on one seed set:
#
#   exsim_research run config/research/fixed_spread_narrow.conf --seeds 1..5 --out runs/narrow
#   exsim_research run config/research/fixed_spread_wide.conf   --seeds 1..5 --out runs/wide
#   exsim_research compare runs/narrow runs/wide
#
# Every key is documented in research runner.

[experiment]
name = fixed_spread_narrow
description = Fixed-spread market maker, half spread 1 tick, MM + noise background
seed = 1
duration = 60s
max_simulation_events = 50000000

[instrument]
symbol = SYNTH
tick_size = 0.01
lot_size = 1
max_order_qty = 100000
min_price = 50.00
max_price = 150.00
reference_price = 100.00

[engine]
max_orders = 4096

# Separate one-way latency components (simulated time).
[latency]
feed = 50us
order = 100us
cancel = 80us
ack = 100us
strategy_compute = 5us
feed_jitter = 10us
order_jitter = 20us
cancel_jitter = 20us
ack_jitter = 20us
order_channel_fifo = true

# Currency per share; negative is a rebate.
[fees]
maker_fee_per_share = -0.002
taker_fee_per_share = 0.003

[risk]
max_long_position = 500
max_short_position = 500
max_order_qty = 200
max_open_orders = 8

[accounting]
initial_cash = 1000000.00
mark = exchange_mid

[metrics]
markout_horizons = 100ms, 1s, 5s
sample_interval = 100ms

[strategy]
kind = fixed_spread_market_maker
stp = cancel_aggressor
half_spread_ticks = 1
quote_size = 100
requote_interval = 50ms
requote_threshold_ticks = 1
post_only = true

[agent market_maker liquidity]
levels = 3
size = 100
spread_ticks = 1
fair_value_step_ms = 500
fair_value_step_ticks = 1
requote_ms = 100

[agent noise_taker flow]
mean_interval_ms = 20
min_size = 1
max_size = 200
cross_ticks = 2
limit_ppm = 100000
limit_lifetime_ms = 1000
