# TWAP execution baseline: buy 3000 shares over 30 seconds in 1-second IOC
# slices priced at the visible opposite best plus 2 ticks. summary.json
# reports completion, residual quantity and implementation shortfall against
# the arrival (decision-time exchange mid) benchmark.
# Every key is documented in research runner.

[experiment]
name = twap_buy
description = TWAP buy 3000 shares over 30s in 1s IOC slices against the arrival mid
seed = 1
duration = 60s
max_simulation_events = 50000000

[instrument]
symbol = SYNTH
tick_size = 0.01
lot_size = 1
max_order_qty = 100000
min_price = 50.00
max_price = 150.00
reference_price = 100.00

[engine]
max_orders = 4096

# Separate one-way latency components (simulated time).
[latency]
feed = 50us
order = 100us
cancel = 80us
ack = 100us
strategy_compute = 5us
feed_jitter = 10us
order_jitter = 20us
cancel_jitter = 20us
ack_jitter = 20us
order_channel_fifo = true

# Currency per share; negative is a rebate.
[fees]
maker_fee_per_share = -0.002
taker_fee_per_share = 0.003

[risk]
max_long_position = 5000
max_short_position = 500
max_order_qty = 1000
max_open_orders = 8

[accounting]
initial_cash = 1000000.00
mark = exchange_mid

[metrics]
markout_horizons = 100ms, 1s, 5s
sample_interval = 100ms

[strategy]
kind = twap_executor
stp = cancel_aggressor
side = buy
parent_qty = 3000
start = 1s
execution_duration = 30s
slice_interval = 1s
limit_offset_ticks = 2

[agent market_maker liquidity]
levels = 3
size = 100
spread_ticks = 1
fair_value_step_ms = 500
fair_value_step_ticks = 1
requote_ms = 100

[agent noise_taker flow]
mean_interval_ms = 20
min_size = 1
max_size = 200
cross_ticks = 2
limit_ppm = 100000
limit_lifetime_ms = 1000
