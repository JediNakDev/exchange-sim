# exsim example configuration. Format: docs in lib/include/server/config.hpp.

[exchange]
name = EXSIM                 # FIX TargetCompID clients must use
bind_address = 127.0.0.1
ouch_port = 15000            # OUCH 4.2 over SoupBinTCP 3.0
fix_port = 15001             # FIX 4.4
fixp_sbe_port = 15003        # SBE over FIXP (historical design notes)
admin_port = 15002           # line-based admin / fault-injection console
max_connections = 64
heartbeat_interval_ms = 1000
soup_session = EXSIM
trading_day_start = 00:00    # local time; commands stamped outside the
trading_day_end = 24:00      # [start, end) window are refused, and the
                             # exchange closes itself at the end

[market_data]                # ITCH 5.0 over MoldUDP64
address = 239.192.10.1       # multicast group (or a unicast address)
port = 16000
interface =                  # empty = default interface
ttl = 1
loopback = true
retransmit_port = 16001      # MoldUDP64 request server (UDP)
max_payload = 1400
session = EXSIM
retransmit_buffer = 1048576
noii_interval_ms = 1000      # NOII cadence during auction call phases

[engine]
max_instruments = 64
max_orders = 1048576
max_tokens_per_session = 1048576
store_messages_per_session = 1048576
store_bytes_per_session = 67108864

[journal]
path = exsim.journal         # empty = disabled
on_failure = shutdown        # shutdown (close the exchange) | continue
flush_interval_ms = 1000     # timer-driven flush; 0 = only at shutdown

[instrument AAPL]
tick_size = 0.01
lot_size = 1
max_order_qty = 1000000
min_price = 0.01
max_price = 1000.00
reference_price = 150.00
initial_phase = pre_open

[instrument MSFT]
tick_size = 0.01
min_price = 0.01
max_price = 2000.00
reference_price = 400.00
initial_phase = pre_open

[instrument SPY]
tick_size = 0.01
min_price = 0.01
max_price = 2000.00
reference_price = 500.00
initial_phase = continuous

[user ALICE]
password = alice
protocol = ouch42
session_id = 1
owner = 1
stp = cancel_resting
cancel_on_disconnect = true

[user BOB]
password = bob
protocol = ouch42
session_id = 2
owner = 2
stp = none
cancel_on_disconnect = true

[user CAROL]                 # FIX SenderCompID
password = carol
protocol = fix44
session_id = 3
owner = 1                    # same firm as ALICE: STP applies between them
stp = cancel_aggressor
cancel_on_disconnect = false

[user MM1]                   # simulated market maker
password = mm1
protocol = ouch42
session_id = 100
owner = 100
stp = cancel_resting
cancel_on_disconnect = true

[user NT1]                   # simulated noise taker
password = nt1
protocol = ouch42
session_id = 101
owner = 101
cancel_on_disconnect = true

# Simulated liquidity. Each bot drives one user exclusively (that user can
# no longer log in); session_id and owner come from the user, stp too
# unless set here. Remaining keys: lib/include/sim/bots/README.md.
# `bots on|off` on the admin console pauses and resumes them.

[bot spy_maker]
type = market_maker
user = MM1
instrument = SPY
seed = 1
levels = 3
size = 100
spread_ticks = 1
requote_ms = 100
fair_value_step_ms = 1000

[bot spy_taker]
type = noise_taker
user = NT1
instrument = SPY
seed = 2
mean_interval_ms = 250
min_size = 10
max_size = 100
limit_ppm = 200000
