services:
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-exsim.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  # Each run launches exsim_exchanged and exsim_traderd with private UDS
  # channels inside this container. No Docker socket or fixed worker ports.
  api:
    image: ${EXSIM_API_IMAGE:-exsim-api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      EXSIM_DATABASE_URL: host=db port=5432 dbname=exsim user=exsim
    secrets:
      - app_password
    volumes:
      - run_artifacts:/var/lib/exsim
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:7600/v1/service"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 45s

  web:
    image: ${EXSIM_WEB_IMAGE:-exsim-web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      EXSIM_API_BASE_URL: http://api:7600
    ports:
      - "${EXSIM_BIND_ADDRESS:-127.0.0.1}:${EXSIM_WEB_PORT:-3761}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/exsim/v1/service').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  app_password:
    file: ./.secrets/app_password

volumes:
  postgres_data:
  run_artifacts:
